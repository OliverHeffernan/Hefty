name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Hefty.sln

      - name: Build
        run: dotnet build Hefty.sln --configuration Release --no-restore

      - name: Headless regression tests
        run: dotnet test tests/Hefty.Tests/Hefty.Tests.csproj --configuration Release --no-build

      - name: Pack and test package
        run: bash scripts/test-package.sh

      - name: Native packaged integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1 libsdl2-2.0-0
          xvfb-run -a env ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=1 \
            dotnet tests/Hefty.PackageSmoke/bin/Release/net10.0/Hefty.PackageSmoke.dll --host

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: hefty-engine-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
